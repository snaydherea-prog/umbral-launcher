name: Compilar Umbral Launcher para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - 'tools/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Configurar identidad Microsoft de Umbral
        shell: bash
        env:
          UMBRAL_CLIENT_ID: ${{ vars.UMBRAL_MICROSOFT_CLIENT_ID }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configPath = 'src/microsoft-app.json';
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
          const clientId = (process.env.UMBRAL_CLIENT_ID || config.clientId || '').trim();
          if (!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(clientId)) {
            throw new Error('Falta un Client ID de Microsoft válido.');
          }
          fs.writeFileSync(configPath, JSON.stringify({ clientId }, null, 2) + '\n');
          console.log('Microsoft Client ID configurado: ' + clientId);
          NODE
      - name: Revisar JavaScript
        run: npm run check
      - name: Probar importación, publicación y actualización
        run: npm test
      - name: Compilar para Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win
      - name: Verificar identidad y ejecutables empaquetados
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const asar = require('@electron/asar');
          const expected = require('./src/microsoft-app.json');
          const actual = JSON.parse(asar.extractFile('dist/win-unpacked/resources/app.asar', 'src/microsoft-app.json').toString('utf8'));
          assert.equal(actual.clientId, expected.clientId);
          const distribution = JSON.parse(asar.extractFile('dist/win-unpacked/resources/app.asar', 'src/distribution.json').toString('utf8'));
          assert.equal(distribution.curseforgeApproved, require('./src/distribution.json').curseforgeApproved);
          for (const file of ['src/admin-renderer.js', 'src/pack-import.js', 'src/pack-sync.js', 'src/pack-publish.js', 'node_modules/yauzl/index.js', 'node_modules/yazl/index.js']) {
            assert.ok(asar.extractFile('dist/win-unpacked/resources/app.asar', path.normalize(file)).length > 0, 'Falta ' + file);
          }
          // Load packaged modules in isolation so missing transitive dependencies fail here.
          const os = require('node:os');
          const smoke = fs.mkdtempSync(path.join(os.tmpdir(), 'umbral-package-'));
          try {
            asar.extractAll('dist/win-unpacked/resources/app.asar', smoke);
            const requireApp = require('node:module').createRequire(path.join(smoke, 'package.json'));
            for (const name of ['pack-import', 'pack-sync', 'pack-publish', 'curseforge']) requireApp('./src/' + name);
            console.log('Módulos empaquetados y sus dependencias verificados.');
          } finally { fs.rmSync(smoke, {recursive: true, force: true}); }
          const { version } = require('./package.json');
          for (const target of ['Setup', 'Portable']) {
            const file = `dist/Umbral-Launcher-${target}-${version}-x64.exe`;
            assert.ok(fs.statSync(file).size > 0, 'Falta el ejecutable: ' + file);
            console.log('Verificado: ' + file);
          }
          console.log('Client ID verificado dentro de app.asar: ' + actual.clientId);
          NODE
      - name: Publicar artefactos
        uses: actions/upload-artifact@v4
        with:
          name: Umbral-Launcher-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30
